<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destination Details - Travel Aura</title>
  <link rel="stylesheet" href="dashboard.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <style>
    .destination-details-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 20px;
    }

    .destination-hero {
      position: relative;
      height: 400px;
      border-radius: 15px;
      overflow: hidden;
      margin-bottom: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    .destination-hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .destination-hero-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8), transparent);
      padding: 30px;
      color: white;
    }

    .destination-hero h1 {
      font-size: 3rem;
      margin-bottom: 10px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .destination-type-badge {
      display: inline-block;
      background: #c38828;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .destination-content {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 30px;
      margin-bottom: 30px;
    }

    .destination-info {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .destination-info h2 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.8rem;
      border-bottom: 3px solid #c38828;
      padding-bottom: 10px;
    }

    .destination-info p {
      line-height: 1.8;
      color: #666;
      font-size: 1.1rem;
      margin-bottom: 20px;
    }

    .destination-rating {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
      font-size: 1.2rem;
    }

    .stars {
      color: #ffa500;
    }

    .booking-card {
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      position: sticky;
      top: 20px;
      height: fit-content;
    }

    .booking-card h3 {
      color: #333;
      margin-bottom: 20px;
      font-size: 1.5rem;
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      color: #333;
      font-weight: 600;
      font-size: 0.9rem;
    }

    .form-group label i {
      margin-right: 8px;
      color: #c38828;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px 15px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: #c38828;
      box-shadow: 0 0 0 3px rgba(195, 136, 40, 0.1);
    }

    .price-summary {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 10px;
      margin: 20px 0;
    }

    .price-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 1rem;
    }

    .price-row.total {
      font-size: 1.3rem;
      font-weight: 700;
      color: #c38828;
      border-top: 2px solid #ddd;
      padding-top: 10px;
      margin-top: 10px;
    }

    .book-now-btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #c38828 0%, #15161c 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .book-now-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(195, 136, 40, 0.4);
    }

    .book-now-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .features-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      margin: 30px 0;
    }

    .feature-item {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px;
      background: #f8f9fa;
      border-radius: 10px;
    }

    .feature-item i {
      font-size: 2rem;
      color: #c38828;
    }

    .feature-item div h4 {
      margin: 0;
      color: #333;
      font-size: 1rem;
    }

    .feature-item div p {
      margin: 5px 0 0 0;
      color: #666;
      font-size: 0.9rem;
    }

    .back-button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 20px;
      background: #f8f9fa;
      color: #333;
      text-decoration: none;
      border-radius: 8px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .back-button:hover {
      background: #e9ecef;
      transform: translateX(-5px);
    }

    @media (max-width: 768px) {
      .destination-content {
        grid-template-columns: 1fr;
      }

      .destination-hero h1 {
        font-size: 2rem;
      }

      .booking-card {
        position: static;
      }
    }
  </style>
</head>
<body>
  <div class="destination-details-container">
    <a href="dashboard.html" class="back-button">
      <i class="fas fa-arrow-left"></i> Back to Dashboard
    </a>

    <div class="destination-hero">
      <img id="destinationImage" class="destination-hero-image" src="" alt="Destination">
      <div class="destination-hero-overlay">
        <h1 id="destinationName">Loading...</h1>
        <span id="destinationType" class="destination-type-badge">Category</span>
      </div>
    </div>

    <div class="destination-content">
      <div class="destination-info">
        <h2><i class="fas fa-info-circle"></i> About This Destination</h2>
        <p id="destinationDescription">Loading description...</p>

        <div class="destination-rating">
          <span class="stars" id="destinationRating"></span>
          <span id="ratingText"></span>
        </div>

        <h2><i class="fas fa-star"></i> Features & Highlights</h2>
        <div class="features-grid">
          <div class="feature-item">
            <i class="fas fa-map-marker-alt"></i>
            <div>
              <h4>Location</h4>
              <p id="featureLocation">Tamil Nadu, India</p>
            </div>
          </div>
          <div class="feature-item">
            <i class="fas fa-sun"></i>
            <div>
              <h4>Best Season</h4>
              <p>October - March</p>
            </div>
          </div>
          <div class="feature-item">
            <i class="fas fa-clock"></i>
            <div>
              <h4>Duration</h4>
              <p>2-3 Days Recommended</p>
            </div>
          </div>
          <div class="feature-item">
            <i class="fas fa-camera"></i>
            <div>
              <h4>Photo Spots</h4>
              <p>Unlimited Opportunities</p>
            </div>
          </div>
        </div>
      </div>

      <div class="booking-card">
        <h3><i class="fas fa-calendar-check"></i> Book Your Trip</h3>
        
        <form id="bookingForm">
          <div class="form-group">
            <label for="startDate">
              <i class="fas fa-calendar-alt"></i> Start Date
            </label>
            <input type="date" id="startDate" required>
          </div>

          <div class="form-group">
            <label for="endDate">
              <i class="fas fa-calendar-alt"></i> End Date
            </label>
            <input type="date" id="endDate" required>
          </div>

          <div class="form-group">
            <label for="travelers">
              <i class="fas fa-users"></i> Number of Travelers
            </label>
            <select id="travelers" required>
              <option value="1">1 Person</option>
              <option value="2">2 People</option>
              <option value="3">3 People</option>
              <option value="4">4 People</option>
              <option value="5">5 People</option>
              <option value="6">6 People</option>
              <option value="7">7 People</option>
              <option value="8">8 People</option>
              <option value="9">9 People</option>
              <option value="10">10+ People</option>
            </select>
          </div>

          <div class="price-summary">
            <div class="price-row">
              <span>Duration</span>
              <span id="durationDisplay">-</span>
            </div>
            <div class="price-row">
              <span>Travelers</span>
              <span id="travelersDisplay">1</span>
            </div>
            <div class="price-row total">
              <span>Ready to Book</span>
              <span><i class="fas fa-check-circle"></i></span>
            </div>
          </div>

          <button type="submit" class="book-now-btn" id="bookNowBtn">
            <i class="fas fa-ticket-alt"></i> Book Now
          </button>
        </form>
      </div>
    </div>
  </div>

  <script src="destination-details.js"></script>
</body>
</html>
