<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Travel Aura - Tamil Nadu Tourism</title>
  <link rel="stylesheet" href="style.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
  />
</head>

<body>
  <!-- ====== NAVBAR ====== -->
  <nav>
    <ul>
      <li class="login-btn" onclick="openModal()">
        <i class="fas fa-sign-in-alt"></i> Login
      </li>
    </ul>
  </nav>

  <!-- ====== HERO SECTION ====== -->
  <section class="hero">
    <img src="2.jpg" alt="Tamil Nadu Tourism" class="hero-bg" />
    <div class="overlay-text">
      <h1>Travel Aura</h1>
      <p>Discover the Land of Temples, Culture, and Natural Beauty</p>
    </div>
  </section>

  <!-- ====== LOGIN / SIGNUP MODAL ====== -->
  <div id="loginModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">&times;</span>

      <!-- Login Form -->
      <div id="loginForm">
        <h2><i class="fas fa-user-circle"></i> Login</h2>
        <p style="font-size: 0.9em; color: #ddd; margin-bottom: 15px;">
          <i class="fas fa-info-circle"></i> Login as Admin or Tourist
        </p>
        <input type="text" id="loginUsername" placeholder="Username" />
        <input type="password" id="loginPassword" placeholder="Password" />
        <button id="loginBtn"><i class="fas fa-sign-in-alt"></i> Login</button>
        <div class="toggle-link" onclick="showSignup()">
          Don't have an account? Sign up here
        </div>
      </div>

      <!-- Signup Form -->
      <div id="signupForm" style="display: none;">
        <h2><i class="fas fa-user-plus"></i> Sign Up</h2>
        <p style="font-size: 0.9em; color: #ddd; margin-bottom: 15px;">
          <i class="fas fa-info-circle"></i> Create a tourist account
        </p>
        <input type="text" id="signupUsername" placeholder="Username" />
        <input type="email" id="signupEmail" placeholder="Email" />
        <input type="tel" id="signupPhone" placeholder="Phone Number" />
        <input type="text" id="signupAddress" placeholder="Address" />
        <input type="password" id="signupPassword" placeholder="Password" />
        <button id="signupBtn"><i class="fas fa-user-plus"></i> Sign Up</button>
        <div class="toggle-link" onclick="showLogin()">
          Already have an account? Login here
        </div>
      </div>
    </div>
  </div>

  <!-- ====== WELCOME PAGE ====== -->
  <div id="welcomePage" style="display: none;">
    <div class="welcome-content">
      <h1>Welcome to Travel Aura!</h1>
      <p>You have successfully logged in or signed up.</p>
      <button onclick="logout()" class="back-btn">Logout</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
